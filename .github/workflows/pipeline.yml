name: RoleNova Pipeline

on:
  schedule:
    - cron: "30 1 * * *" # 7:00 AM Asia/Kolkata
  workflow_dispatch:

concurrency:
  group: rolenova-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NODE_ENV: production
      BACKGROUND_JOBS_ENABLED: "false"
      MONGO_URI: ${{ secrets.MONGO_URI }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
      GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      ZAI_MODEL: ${{ vars.ZAI_MODEL }}
      ZAI_BASE_URL: ${{ vars.ZAI_BASE_URL }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
      ENABLE_GROQ_FALLBACK: ${{ vars.ENABLE_GROQ_FALLBACK }}
      ENABLE_ZAI_FALLBACK: ${{ vars.ENABLE_ZAI_FALLBACK }}
      ENABLE_DEEPSEEK_FALLBACK: ${{ vars.ENABLE_DEEPSEEK_FALLBACK }}
      ENABLE_OPENROUTER_FALLBACK: ${{ vars.ENABLE_OPENROUTER_FALLBACK }}
      MATCH_THRESHOLD: "70"
      STRICT_LOCATION_MATCH: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run job:pipeline
