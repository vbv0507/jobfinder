name: RoleNova Telegram Poll

on:
  schedule:
    - cron: "3,18,33,48 * * * *" # Every 15 min, offset from the busiest minute of the hour.
  workflow_dispatch:

concurrency:
  group: rolenova-telegram-poll
  cancel-in-progress: false

jobs:
  poll-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: production
      BACKGROUND_JOBS_ENABLED: "false"
      MONGO_URI: ${{ secrets.MONGO_URI }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
      GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      ZAI_MODEL: ${{ vars.ZAI_MODEL }}
      ZAI_BASE_URL: ${{ vars.ZAI_BASE_URL }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
      ENABLE_GROQ_FALLBACK: ${{ vars.ENABLE_GROQ_FALLBACK }}
      ENABLE_ZAI_FALLBACK: ${{ vars.ENABLE_ZAI_FALLBACK }}
      ENABLE_DEEPSEEK_FALLBACK: ${{ vars.ENABLE_DEEPSEEK_FALLBACK }}
      ENABLE_OPENROUTER_FALLBACK: ${{ vars.ENABLE_OPENROUTER_FALLBACK }}
      MATCH_THRESHOLD: "70"
      STRICT_LOCATION_MATCH: "true"
      TELEGRAM_POLL_MESSAGE_LIMIT: "200"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run job:telegram-poll
